<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="画像を円形に配置し、缶バッジの仕上がりを確認できる自主制作プロトタイプ。" />
    <title>Badge Studio｜缶バッジプレビュー</title>
    <style>
      :root {
        --paper: #f4f1e9;
        --panel: #fffdf8;
        --ink: #17202a;
        --muted: #66717a;
        --line: rgba(23, 32, 42, 0.16);
        --accent: #ff5b3f;
        --accent-dark: #c93720;
        --safe: #13a68f;
        --shadow: 0 24px 60px rgba(32, 27, 20, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        background:
          radial-gradient(circle at 8% 10%, rgba(255, 91, 63, 0.12), transparent 30%),
          linear-gradient(rgba(23, 32, 42, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 32, 42, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: auto, 28px 28px, 28px 28px, auto;
        color: var(--ink);
        font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      }

      button, input { font: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 3px solid var(--safe); outline-offset: 3px; }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin-inline: auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-dark);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.6rem); letter-spacing: -0.06em; line-height: 0.95; }
      .lead { max-width: 420px; margin: 0; color: var(--muted); line-height: 1.7; }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .stage {
        display: grid;
        min-height: 620px;
        place-items: center;
        padding: clamp(24px, 6vw, 72px);
        border-right: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(255,255,255,.68), rgba(255,255,255,.12)),
          #e6e0d5;
      }

      .canvas-wrap {
        position: relative;
        width: min(100%, 500px);
        aspect-ratio: 1;
        border-radius: 50%;
        box-shadow: 0 28px 55px rgba(23, 32, 42, 0.24), inset 0 0 0 10px rgba(255,255,255,.36);
        touch-action: none;
        user-select: none;
      }

      canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }

      .canvas-wrap::after {
        position: absolute;
        inset: 8%;
        border: 2px dashed rgba(255,255,255,.9);
        border-radius: 50%;
        content: "";
        pointer-events: none;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,.45));
      }

      .safe-label {
        position: absolute;
        right: 13%;
        bottom: 13%;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(19, 166, 143, .92);
        color: #fff;
        font-size: .66rem;
        font-weight: 800;
        letter-spacing: .08em;
        pointer-events: none;
      }

      .controls { padding: 34px; }
      .step { padding: 24px 0; border-bottom: 1px solid var(--line); }
      .step:first-child { padding-top: 0; }
      .step:last-child { border-bottom: 0; padding-bottom: 0; }
      .step-label { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; font-weight: 800; }
      .step-label span { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid var(--ink); border-radius: 50%; font-size: .7rem; }

      .upload {
        display: grid;
        min-height: 88px;
        place-items: center;
        border: 1px dashed var(--line);
        background: #fff;
        color: var(--muted);
        font-weight: 700;
        text-align: center;
      }
      .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .upload strong { color: var(--ink); }

      .range-row { display: grid; grid-template-columns: 84px 1fr 52px; align-items: center; gap: 10px; margin-top: 12px; }
      .range-row label { color: var(--muted); font-size: .84rem; }
      .range-row output { text-align: right; font-variant-numeric: tabular-nums; font-size: .78rem; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }

      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .button { min-height: 46px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-weight: 800; }
      .button--primary { background: var(--ink); color: white; }
      .button:hover { transform: translateY(-1px); }
      .hint { margin: 12px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.6; }

      .status { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--safe); font-size: .74rem; font-weight: 800; }
      .status::before { width: 8px; height: 8px; border-radius: 50%; background: currentColor; content: ""; box-shadow: 0 0 0 5px rgba(19,166,143,.12); }

      @media (max-width: 820px) {
        header { align-items: flex-start; flex-direction: column; }
        main { grid-template-columns: 1fr; }
        .stage { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        .controls { padding: 26px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <p class="eyebrow">SELF-INITIATED PROTOTYPE / 01</p>
          <h1>Badge Studio</h1>
        </div>
        <p class="lead">写真をアップロードし、ドラッグ・拡大・回転で缶バッジの仕上がりを確認できる操作検証用デモです。</p>
      </header>

      <main>
        <section class="stage" aria-label="缶バッジのプレビュー">
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="preview" width="1000" height="1000"></canvas>
            <span class="safe-label">SAFE AREA</span>
          </div>
        </section>

        <section class="controls" aria-label="画像調整">
          <div class="step">
            <div class="step-label"><span>1</span>画像を選ぶ</div>
            <label class="upload">
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp" />
              <span><strong>画像をアップロード</strong><br />PNG / JPEG / WebP</span>
            </label>
          </div>

          <div class="step">
            <div class="step-label"><span>2</span>位置と大きさを調整</div>
            <div class="range-row"><label for="zoom">拡大率</label><input id="zoom" type="range" min="0.6" max="2.8" step="0.01" value="1" /><output id="zoomOut">100%</output></div>
            <div class="range-row"><label for="rotate">回転</label><input id="rotate" type="range" min="-180" max="180" step="1" value="0" /><output id="rotateOut">0°</output></div>
            <p class="hint">円の中をドラッグして位置を調整できます。破線より内側に重要な要素を収めてください。</p>
          </div>

          <div class="step">
            <div class="step-label"><span>3</span>確認して書き出す</div>
            <div class="actions">
              <button class="button" id="reset" type="button">リセット</button>
              <button class="button button--primary" id="download" type="button">PNGを書き出す</button>
            </div>
            <p class="status">プレビュー準備完了</p>
          </div>
        </section>
      </main>
    </div>

    <script>
      const canvas = document.querySelector('#preview');
      const ctx = canvas.getContext('2d');
      const wrap = document.querySelector('#canvasWrap');
      const zoom = document.querySelector('#zoom');
      const rotate = document.querySelector('#rotate');
      const zoomOut = document.querySelector('#zoomOut');
      const rotateOut = document.querySelector('#rotateOut');
      const image = new Image();
      const state = { x: 0, y: 0, zoom: 1, rotate: 0, dragging: false, px: 0, py: 0 };

      const placeholder = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff765f"/><stop offset="1" stop-color="#7534ff"/></linearGradient></defs>
          <rect width="1200" height="1200" fill="url(#g)"/>
          <circle cx="220" cy="220" r="150" fill="#ffd85b" opacity=".92"/>
          <circle cx="1000" cy="960" r="260" fill="#24d2b6" opacity=".72"/>
          <path d="M0 850 Q300 620 600 840 T1200 760 V1200 H0Z" fill="#14212b" opacity=".82"/>
          <text x="600" y="500" text-anchor="middle" fill="white" font-family="Arial" font-size="92" font-weight="700">YOUR DESIGN</text>
          <text x="600" y="590" text-anchor="middle" fill="white" font-family="Arial" font-size="34" letter-spacing="10">BADGE STUDIO</text>
        </svg>`;

      function loadSource(src) { image.onload = () => { fitImage(); draw(); }; image.src = src; }
      function fitImage() {
        const base = Math.max(canvas.width / image.width, canvas.height / image.height);
        state.base = base; state.x = 0; state.y = 0; state.zoom = 1; state.rotate = 0;
        zoom.value = 1; rotate.value = 0; updateOutputs();
      }
      function updateOutputs() { zoomOut.value = `${Math.round(state.zoom * 100)}%`; rotateOut.value = `${state.rotate}°`; }
      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.arc(500, 500, 500, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = '#ddd6c9'; ctx.fillRect(0, 0, 1000, 1000);
        if (image.complete) {
          const scale = (state.base || 1) * state.zoom;
          ctx.translate(500 + state.x, 500 + state.y);
          ctx.rotate(state.rotate * Math.PI / 180);
          ctx.drawImage(image, -image.width * scale / 2, -image.height * scale / 2, image.width * scale, image.height * scale);
        }
        const vignette = ctx.createRadialGradient(500, 460, 300, 500, 500, 520);
        vignette.addColorStop(0, 'rgba(255,255,255,0)'); vignette.addColorStop(1, 'rgba(10,18,24,.18)');
        ctx.fillStyle = vignette; ctx.fillRect(0, 0, 1000, 1000);
        ctx.restore();
      }

      zoom.addEventListener('input', () => { state.zoom = Number(zoom.value); updateOutputs(); draw(); });
      rotate.addEventListener('input', () => { state.rotate = Number(rotate.value); updateOutputs(); draw(); });
      document.querySelector('#file').addEventListener('change', (event) => { const file = event.target.files[0]; if (file) loadSource(URL.createObjectURL(file)); });
      wrap.addEventListener('pointerdown', (event) => { state.dragging = true; state.px = event.clientX; state.py = event.clientY; wrap.setPointerCapture(event.pointerId); });
      wrap.addEventListener('pointermove', (event) => {
        if (!state.dragging) return;
        const ratio = canvas.width / wrap.getBoundingClientRect().width;
        state.x += (event.clientX - state.px) * ratio; state.y += (event.clientY - state.py) * ratio;
        state.px = event.clientX; state.py = event.clientY; draw();
      });
      wrap.addEventListener('pointerup', () => { state.dragging = false; });
      document.querySelector('#reset').addEventListener('click', () => { fitImage(); draw(); });
      document.querySelector('#download').addEventListener('click', () => { const link = document.createElement('a'); link.download = 'badge-preview.png'; link.href = canvas.toDataURL('image/png'); link.click(); });
      loadSource(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(placeholder)}`);
    </script>
  </body>
</html>
